<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Teaching Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--line:#d8dee8;--text:#172033;--muted:#667085;--accent:#1f4e78;--soft:#e9eef5;--present:#e8f5e9;--absent:#fdecec}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
h1{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button{font:inherit;border:0;border-radius:9px;padding:9px 12px;font-weight:650;cursor:pointer}
.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--text)}.danger{background:#fdecec;color:#991b1b}
.home{max-width:1000px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;text-align:right;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-size:18px;font-weight:700;margin-bottom:7px}.card-sub{font-size:13px;color:var(--muted);line-height:1.5}
.hidden{display:none}main.app{padding:12px}.tabs{display:flex;gap:8px;overflow:auto;padding:0 0 10px}
.tab{background:var(--soft);white-space:nowrap}.tab.active{background:var(--accent);color:#fff}
.summary{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:10px}
.tablewrap{overflow:auto;border:1px solid var(--line);background:#fff;border-radius:12px;max-height:76vh}
table{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;direction:ltr}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:#eef3f8;z-index:5}
th.name,td.name{position:sticky;left:0;z-index:20;background:#fff;min-width:225px;max-width:225px;text-align:right;direction:rtl;box-shadow:2px 0 0 var(--line)}
th.sid,td.sid{position:sticky;left:225px;z-index:19;background:#fff;min-width:112px;max-width:112px;direction:ltr;box-shadow:2px 0 0 var(--line)}
thead th.name,thead th.sid{z-index:30;background:#eef3f8}.dateh{min-width:180px;font-size:12px}.date{font-weight:700;margin-bottom:5px}
.actions{display:flex;gap:3px;justify-content:center}.mini{font-size:11px;padding:5px 8px;border-radius:7px;white-space:nowrap}
.pbtn{background:#e8f5e9;color:#166534}.abtn{background:#fdecec;color:#991b1b}
.cb{width:26px;height:26px;accent-color:#2e7d32}.present{background:var(--present)}.absentExplicit{background:var(--absent)}.total{font-weight:700;background:#fafafa}
.status{font-size:12px;color:var(--muted);margin-top:7px}.status.ok{color:#166534}
@media(max-width:700px){th.name,td.name{min-width:170px;max-width:170px}th.sid,td.sid{left:170px;min-width:100px;max-width:100px}.dateh{min-width:90px}}
</style>
</head>
<body>
<header>
<h1 id="headTitle">Attendance</h1><div class="sub" id="headSub">اختر المساق</div>
<div class="toolbar hidden" id="tools">
<button class="secondary" id="back">Courses</button>
<button class="primary" id="saveExcel">Save Excel</button>
<button class="danger" id="resetOriginal">Reset Section</button>
</div>
<div id="status" class="status"></div>
</header>

<section id="home" class="home"><div class="cards" id="cards"></div></section>

<main id="app" class="app hidden">
<div class="tabs" id="tabs"></div>
<div class="summary"><div>Students: <b id="studentCount"></b></div><div>Month sessions: <b id="monthCount"></b></div><div>Semester sessions: <b id="semesterCount"></b></div></div>
<div class="tablewrap"><table id="table"></table></div>
</main>

  dates.forEach(dt=>{
    const [y,m,d]=dt.split('-');
    h+=`<th class="dateh"><div class="date">${d}/${m}</div><div class="actions"><button class="mini pbtn" data-act="P" data-date="${dt}">Mark All Present</button><button class="mini abtn" data-act="A" data-date="${dt}">Mark All Absent</button></div></th>`
  });
  h+='<th class="total">Present</th><th class="total">Absent</th><th class="total">%</th></tr></thead><tbody>';

  section.students.forEach(([sid,name])=>{
    let p=0;
    h+=`<tr data-sid="${sid}"><td class="name">${esc(name)}</td><td class="sid">${sid}</td>`;
    dates.forEach(dt=>{
      const yes=present(dt,sid);
      if(yes)p++;
      const cls=yes?'present':(explicit(dt,sid)?'absentExplicit':'');
      h+=`<td class="${cls}"><input class="cb" type="checkbox" data-date="${dt}" ${yes?'checked':''}></td>`
    });
    const a=dates.length-p,pct=dates.length?Math.round(p/dates.length*100):0;
    h+=`<td class="total pcount">${p}</td><td class="total acount">${a}</td><td class="total pct">${pct}%</td></tr>`
  });
  h+='</tbody>';

  const table=document.getElementById('table');table.innerHTML=h;
  table.querySelectorAll('.cb').forEach(cb=>{
    cb.onchange=()=>{
      const tr=cb.closest('tr'),sid=tr.dataset.sid,dt=cb.dataset.date;
      state[kk(dt,sid)]=cb.checked;
      saveState();
      cb.parentElement.classList.toggle('present',cb.checked);
      cb.parentElement.classList.toggle('absentExplicit',!cb.checked);
      recalc(tr)
    }
  });
  table.querySelectorAll('[data-act="P"]').forEach(b=>{b.onclick=()=>markDay(b.dataset.date,true)});
  table.querySelectorAll('[data-act="A"]').forEach(b=>{b.onclick=()=>markDay(b.dataset.date,false)})
}

function markDay(dt,val){
  section.students.forEach(([sid])=>state[kk(dt,sid)]=val);
  saveState();
  renderMonth()
}
function recalc(tr){
  const boxes=[...tr.querySelectorAll('.cb')];
  const p=boxes.filter(x=>x.checked).length,a=boxes.length-p;
  tr.querySelector('.pcount').textContent=p;
  tr.querySelector('.acount').textContent=a;
  tr.querySelector('.pct').textContent=(boxes.length?Math.round(p/boxes.length*100):0)+'%'
}

document.getElementById('back').onclick=()=>{
  section=null;state={};currentMonth=null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('tools').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('headTitle').textContent='Attendance';
  document.getElementById('headSub').textContent='اختر المساق';
  document.getElementById('status').textContent=''
};

document.getElementById('resetOriginal').onclick=()=>{
  if(!confirm('Reset this section to the values originally read from its Excel file?'))return;
  state=freshState();
  saveState();
  renderMonth()
};

document.getElementById('saveExcel').onclick=()=>{
  saveState();
  if(typeof XLSX==='undefined'){
    alert('Excel export library is unavailable. Connect to the internet and reopen the page.');
    return
  }

  const wb=XLSX.utils.book_new();
  const allDates=Object.values(section.months).flat();
  const summary=[
    [section.title+' | Attendance Tracker'],
    [section.schedule],
    [],
    ['#','Student ID','اسم الطالب','Present','Absent','Attendance %','Status','Notes']
  ];

  section.students.forEach(([sid,name],i)=>{
    let p=0;
    allDates.forEach(dt=>{if(present(dt,sid))p++});
    const a=allDates.length-p,pct=allDates.length?p/allDates.length:0;
    summary.push([i+1,sid,name,p,a,pct,pct>=0.75?'OK':'Warning',''])
  });

  const sws=XLSX.utils.aoa_to_sheet(summary);
  for(let r=4;r<4+section.students.length;r++){
    const ad=XLSX.utils.encode_cell({r:r,c:5});
    if(sws[ad])sws[ad].z='0.0%'
  }
  sws['!cols']=[{wch:5},{wch:14},{wch:34},{wch:10},{wch:10},{wch:14},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb,sws,'Summary');

  Object.entries(section.months).forEach(([month,dates])=>{
    const rows=[
      [section.title+' | '+month],
      ['☑ = حاضر   |   ☐ = غائب'],
      [],
      ['#','Student ID','اسم الطالب',...dates.map(dt=>{const [y,m,d]=dt.split('-');return `${d}/${m}`;}),'Present','Absent','%']
    ];
    section.students.forEach(([sid,name],i)=>{
      const marks=dates.map(dt=>present(dt,sid)?'☑':'☐');
      const p=marks.filter(x=>x==='☑').length,a=dates.length-p;
      rows.push([i+1,sid,name,...marks,p,a,dates.length?p/dates.length:0])
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const pctCol=3+dates.length+2;
    for(let r=4;r<4+section.students.length;r++){
      const ad=XLSX.utils.encode_cell({r:r,c:pctCol});
      if(ws[ad])ws[ad].z='0.0%'
    }
    ws['!cols']=[{wch:5},{wch:14},{wch:34},...dates.map(()=>({wch:8})),{wch:10},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws,month)
  });

  XLSX.writeFile(wb,section.key+'_Attendance_UPDATED.xlsx');
  const st=document.getElementById('status');
  st.textContent='Saved locally and updated Excel downloaded.';
  st.className='status ok'
};
</script>
</body>
</html>
